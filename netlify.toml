[build]
  command = "npm ci && npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"
  NPM_FLAGS = "--legacy-peer-deps"
  NODE_ENV = "production"
  CI = "true"

[functions]
  included_files = ["node_modules/**/*"]

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200 