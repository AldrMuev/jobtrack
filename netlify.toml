[build]
  command = "npm install && npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"
  NPM_FLAGS = "--no-optional"
  NODE_ENV = "production"

[functions]
  included_files = ["node_modules/**/*"]

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200 